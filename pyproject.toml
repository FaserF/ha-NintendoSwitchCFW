[project]
name = "ha-NintendoSwitchCFW"
version = "0.2.4-dev0"
description = "Home Assistant integration for Nintendo Switch CFW"
readme = "README.md"
authors = [
    { name = "FaserF" }
]
license = { text = "MIT" }
requires-python = "==3.14.7"
dependencies = [
    "aiohttp==3.13.5",
    "homeassistant==2026.6.4",
]

[tool.setuptools.packages.find]
include = ["custom_components*"]

[project.optional-dependencies]
test = [
    "pytest==9.0.3",
    "pytest-asyncio",
    "pytest-homeassistant-custom-component",
    "respx",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
norecursedirs = [".git", "custom_components"]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4"]
ignore = ["E501", "B008", "SIM102", "SIM105", "SIM117", "E402", "B017", "B904", "ARG001", "RUF012", "DTZ003", "DTZ007", "DTZ001", "DTZ005", "BLE001", "S110", "S112"]

[tool.mypy]
explicit_package_bases = true
python_version = "3.14"
check_untyped_defs = true
disallow_any_generics = true
ignore_missing_imports = true
no_implicit_optional = true
show_error_codes = true
strict_equality = true
warn_redundant_casts = true
warn_return_any = true
warn_unused_configs = true
warn_unused_ignores = false
